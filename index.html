<title>정도2관 수련비 관리</title>
<style>
  :root{
    --bg:#0e0f14; --panel:#171922; --panel-soft:#1e2030; --ink:#f2f3f7; --sub:#9aa0b4;
    --line:#2a2d3d; --accent:#ffd400; --ok:#3ddc84; --danger:#ff5a6e; --blue:#4d90fe;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Malgun Gothic',sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px 110px;}
  h1{font-size:19px;margin:6px 0 2px;}
  h2{font-size:15px;margin:0 0 8px;}
  .sub{font-size:12.5px;color:var(--sub);margin-bottom:14px;line-height:1.5;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;}
  input[type="text"],input[type="number"],input[type="date"],input[type="search"],select,textarea{
    width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel-soft);color:var(--ink);font-size:14px;font-family:inherit;
  }
  label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:4px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:90px;}
  .btn{
    padding:10px 14px;border-radius:10px;border:none;font-weight:800;font-size:13px;
    cursor:pointer;color:#111;background:var(--accent);
  }
  .btn.ghost{ background:transparent;border:1px solid var(--line);color:var(--ink); }
  .btn.ok{ background:var(--ok); }
  .btn.danger{ background:var(--danger);color:#fff; }
  .btn.small{ padding:6px 10px;font-size:12px; }
  .btn.blue{ background:var(--blue);color:#fff; }
  .btn:disabled{opacity:.4;cursor:default;}
  .toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800;}
  .badge.warn{background:rgba(255,90,110,0.18);color:var(--danger);}
  .badge.ok{background:rgba(61,220,132,0.16);color:var(--ok);}
  .badge.sib{background:rgba(77,144,254,0.18);color:var(--blue);}
  .badge.demo{background:rgba(255,212,0,0.18);color:var(--accent);}
  .empty-state{text-align:center;color:var(--sub);font-size:13px;padding:26px 10px;}
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:30;white-space:nowrap;max-width:90%;text-align:center;
  }
  .toast.show{opacity:1;}
  .tabbar{ display:flex; gap:6px; margin-bottom:12px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:4px; overflow-x:auto; }
  .tab-btn{ flex:1; white-space:nowrap; padding:9px 8px; border-radius:9px; border:none; background:transparent;
    color:var(--sub); font-weight:800; font-size:12px; cursor:pointer; }
  .tab-btn.active{ background:var(--accent); color:#111; }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }
  .stu-row{ background:var(--panel);border:1px solid var(--line);border-radius:12px; padding:11px 12px;margin-bottom:8px; }
  .stu-row.review{ border-color:rgba(255,90,110,0.6); }
  .stu-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .stu-name{ font-size:15px; font-weight:800; }
  .stu-sub{ font-size:11.5px; color:var(--sub); }
  .stu-details{ margin-top:8px; display:none; }
  .stu-row.open .stu-details{ display:block; }
  .chev{ margin-left:auto; color:var(--sub); font-size:12px; }
  .field{margin-bottom:8px;}
  .month-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .month-table th, .month-table td{ border-bottom:1px solid var(--line); padding:7px 4px; text-align:center; }
  .month-table th{ color:var(--sub); font-weight:700; font-size:11px; }
  .month-table td input, .month-table td select{ padding:5px 4px; font-size:12px; border-radius:6px; }
  .month-table tr.unpaid td{ background:rgba(255,90,110,0.08); }
  .search-box{margin-bottom:10px;}
  .group-card{ border-left:3px solid var(--blue); }
  .group-members{ font-size:12.5px; color:var(--sub); margin:4px 0 8px; }
  .summary{ font-size:12.5px; color:var(--sub); margin-bottom:10px; display:flex; gap:12px; flex-wrap:wrap; }
  .summary b{ color:var(--accent); }
  .filter-chips{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .chip{ padding:6px 11px; border-radius:999px; border:1px solid var(--line); background:var(--panel-soft);
    color:var(--sub); font-size:12px; font-weight:700; cursor:pointer; }
  .chip.active{ border-color:var(--accent); color:var(--accent); background:rgba(255,212,0,0.1); }
</style>

@media (prefers-reduced-motion: reduce){#jd-splash img{animation:none}#jd-splash{transition:none}}
</style>
<script>
(function(){
  var t0=Date.now();
  function hide(){ var s=document.getElementById("jd-splash"); if(!s||s.classList.contains("out")) return; s.classList.add("out"); setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); },700); }
  window.addEventListener("load",function(){ setTimeout(hide,Math.max(0,750-(Date.now()-t0))); });
  setTimeout(hide,4000);
  if("serviceWorker" in navigator){ window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
  var KEY="jd-install-off-tuition", dp=null;
  var standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone;
  window.addEventListener("beforeinstallprompt",function(e){
    e.preventDefault(); dp=e; if(standalone) return; try{ if(localStorage.getItem(KEY)) return; }catch(_){}
    if(document.getElementById("jd-install")) return;
    var b=document.createElement("div"); b.id="jd-install"; b.innerHTML="<span>홈 화면에 앱으로 설치</span><button class='go' type='button'>설치</button><button class='x' type='button' aria-label='닫기'>닫기</button>";
    b.querySelector(".go").onclick=function(){ dp.prompt(); dp.userChoice.then(function(){ b.remove(); }); };
    b.querySelector(".x").onclick=function(){ b.remove(); try{ localStorage.setItem(KEY,"1"); }catch(_){} };
    document.body.appendChild(b);
  });
  window.addEventListener("appinstalled",function(){ var b=document.getElementById("jd-install"); if(b) b.remove(); });

})();
</script>

/* ===================== 저장소 ===================== */
const STUDENTS_KEY = 'tuition-students-v1';
const GROUPS_KEY = 'tuition-groups-v1';
const MONTH_PREFIX = 'tuition-month-v1-';
const DEFAULT_MONTH = '2026-09';

function loadJSON(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; }
}

/* ===================== 기본요금표 ===================== */
// 도장 요금 기준 (엑셀 비고란 기준, 확인/수정 가능)
const FEE_PRESETS = [
  {type:'주4~5회', fee:160000},
  {type:'주2~3회', fee:155000},
  {type:'시범단', fee:null},
  {type:'직접입력', fee:null},
];

function guessFeeType(days, weekday, isDemo){
  if (isDemo) return '시범단';
  const combo = (days||'') + (weekday||'');
  if (combo.includes('시범단')) return '시범단';
  if (/주[45]/.test(days||'')) return '주4~5회';
  if (/주[23]/.test(days||'')) return '주2~3회';
  const wd = weekday || '';
  const dayCount = (wd.match(/[월화수목금]/g)||[]).length;
  if (dayCount >= 4) return '주4~5회';
  if (dayCount >= 2 && dayCount > 0) return '주2~3회';
  return '미정';
}
function feeForType(type){
  const p = FEE_PRESETS.find(f=>f.type===type);
  return p ? p.fee : null;
}

/* ===================== 초기화 ===================== */
let students = loadJSON(STUDENTS_KEY, null);
if (!students){
  students = SEED_STUDENTS.map(s => {
    const feeType = guessFeeType(s.days, s.weekday, s.isDemoGuess);
    return {
      id: s.id, name: s.name, grade: s.grade,
      fatherName: s.fatherName, fatherPhone: s.fatherPhone,
      motherName: s.motherName, motherPhone: s.motherPhone,
      days: s.days, weekday: s.weekday,
      sibGroup: s.sibGroup || null,
      isDemo: !!s.isDemoGuess,
      feeType: feeType,
      baseFee: feeForType(feeType),
      needsReview: !!s.needsReview,
      reviewReason: s.reviewReason || '',
      reviewDone: false,
    };
  });
  saveJSON(STUDENTS_KEY, students);
}

let groups = loadJSON(GROUPS_KEY, null);
if (!groups){
  groups = {};
  Object.keys(SEED_SIB_GROUP_NAMES).forEach(gid => {
    groups[gid] = { name: SEED_SIB_GROUP_NAMES[gid].join('·'), discountType:'amount', discountValue:0 };
  });
  saveJSON(GROUPS_KEY, groups);
}

function monthKey(m){ return MONTH_PREFIX + m; }
function loadMonth(m){
  let data = loadJSON(monthKey(m), null);
  if (!data && m === DEFAULT_MONTH){
    data = {};
    SEED_STUDENTS.forEach(s => {
      data[s.id] = {
        paydate: s.paydate || '', method: s.method || '', amount: s.amount || null,
        note: s.note || '', sickDays:0, travelDays:0, personalDays:0, deduction:0
      };
    });
    saveJSON(monthKey(m), data);
  }
  if (!data) data = {};
  return data;
}
function saveMonth(m, data){ saveJSON(monthKey(m), data); }

let currentMonth = DEFAULT_MONTH;
let reviewFilter = 'all'; // 'all' | 'needs'
let monthData = loadMonth(currentMonth);

/* ===================== 유틸 ===================== */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}
function fmtMoney(n){
  if (n === null || n === undefined || n === '') return '-';
  return Number(n).toLocaleString('ko-KR') + '원';
}
function studentById(id){ return students.find(s=>s.id===id); }
function persistStudents(){ saveJSON(STUDENTS_KEY, students); }
function persistGroups(){ saveJSON(GROUPS_KEY, groups); }

function suggestedAmount(stu, mrec){
  if (!stu) return null;
  let base = stu.baseFee;
  if (base === null || base === undefined) return null;
  let amt = base;
  if (stu.sibGroup && groups[stu.sibGroup]){
    const g = groups[stu.sibGroup];
    if (g.discountType === 'percent') amt = amt - Math.round(amt * (g.discountValue||0) / 100);
    else amt = amt - (g.discountValue||0);
  }
  if (mrec){
    amt = amt - (mrec.deduction || 0);
  }
  return Math.max(amt, 0);
}

/* ===================== 탭 전환 ===================== */
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-'+tab));
  render();
}
function render(){
  const active = document.querySelector('.tab-btn.active').dataset.tab;
  if (active === 'review') renderReview();
  else if (active === 'month') renderMonth();
  else if (active === 'unpaid') renderUnpaid();
  else if (active === 'sibling') renderSibling();
  else if (active === 'absence') renderAbsence();
  updateTopSub();
}
function updateTopSub(){
  const needReview = students.filter(s=>s.needsReview && !s.reviewDone).length;
  const el = document.getElementById('topSub');
  if (needReview > 0){
    el.innerHTML = `원생 <b style="color:var(--accent)">${students.length}명</b> 중 <b style="color:var(--danger)">${needReview}명</b> 확인이 필요해요. '원생확인' 탭에서 확인해주세요.`;
  } else {
    el.textContent = `원생 ${students.length}명 · 모든 원생 확인 완료`;
  }
}


/* ===================== 원생확인 탭 ===================== */
let openIds = new Set();
function toggleOpen(id){
  if (openIds.has(id)) openIds.delete(id); else openIds.add(id);
  renderReview();
}
function groupOptionsHtml(selected){
  let html = `<option value="">형제그룹 없음</option>`;
  Object.keys(groups).forEach(gid => {
    html += `<option value="${gid}" ${selected===gid?'selected':''}>${groups[gid].name}</option>`;
  });
  html += `<option value="__new__">+ 새 그룹 만들기</option>`;
  return html;
}
function feeTypeOptionsHtml(selected){
  return FEE_PRESETS.map(f => `<option value="${f.type}" ${selected===f.type?'selected':''}>${f.type}${f.fee?` (${f.fee.toLocaleString()}원)`:''}</option>`).join('');
}

function renderReview(){
  const panel = document.getElementById('panel-review');
  const needReview = students.filter(s=>s.needsReview && !s.reviewDone);
  const list = reviewFilter === 'needs' ? needReview : students.slice().sort((a,b)=>{
    const ar = (a.needsReview && !a.reviewDone) ? 0 : 1;
    const br = (b.needsReview && !b.reviewDone) ? 0 : 1;
    if (ar !== br) return ar - br;

  let html = `
    <div class="card">
      <h2>원생 통합 확인</h2>
      <div class="sub">출석부 원생목록과 수련비 명단을 대조했어요. 형제그룹·시범단·기본요금을 확인/수정해주세요.</div>
      <div class="filter-chips">
        <div class="chip ${reviewFilter==='all'?'active':''}" onclick="reviewFilter='all';renderReview();">전체 ${students.length}</div>
        <div class="chip ${reviewFilter==='needs'?'active':''}" onclick="reviewFilter='needs';renderReview();">확인필요 ${needReview.length}</div>
      </div>
    </div>
  `;

  if (list.length === 0){
    html += `<div class="empty-state">확인이 필요한 원생이 없어요 🎉</div>`;
  }

  list.forEach(s => {
    const isOpen = openIds.has(s.id);
    const badges = [];
    if (s.needsReview && !s.reviewDone) badges.push(`<span class="badge warn">확인필요</span>`);
    if (s.sibGroup && groups[s.sibGroup]) badges.push(`<span class="badge sib">형제:${groups[s.sibGroup].name}</span>`);
    if (s.isDemo) badges.push(`<span class="badge demo">시범단</span>`);

    html += `<div class="stu-row ${isOpen?'open':''} ${s.needsReview && !s.reviewDone?'review':''}">
      <div class="stu-top" onclick="toggleOpen('${s.id}')" style="cursor:pointer;">
        <div>
          <div class="stu-name">${s.name} <span class="stu-sub">${s.grade||''}</span></div>
          <div style="margin-top:4px;">${badges.join(' ')}</div>
        </div>
        <div class="chev">${isOpen?'▲':'▼'}</div>
      </div>
      <div class="stu-details">
        ${s.needsReview && !s.reviewDone ? `<div class="badge warn" style="display:block;margin-bottom:8px;padding:8px 10px;">⚠ ${s.reviewReason || '확인이 필요합니다'}</div>` : ''}
        <div class="field">
          <label>학부모 연락처</label>
          <div class="sub" style="margin:0;">아버지 ${s.fatherName||'-'} ${s.fatherPhone||''} / 어머니 ${s.motherName||'-'} ${s.motherPhone||''}</div>
        </div>
        <div class="row">
          <div class="field">
            <label>형제그룹</label>
            <select onchange="onSibGroupChange('${s.id}', this.value)">${groupOptionsHtml(s.sibGroup)}</select>
          </div>
          <div class="field" style="max-width:110px;flex:0 0 110px;">
            <label>시범단</label>
            <select onchange="onFieldChange('${s.id}','isDemo', this.value==='true')">
              <option value="false" ${!s.isDemo?'selected':''}>아니오</option>
              <option value="true" ${s.isDemo?'selected':''}>예</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>기본요금 구분</label>
            <select onchange="onFeeTypeChange('${s.id}', this.value)">${feeTypeOptionsHtml(s.feeType)}</select>

          <div class="field">
            <label>기본요금(원)</label>

        <div class="toolbar">
          ${s.needsReview && !s.reviewDone ? `<button class="btn ok small" onclick="markReviewDone('${s.id}')">확인 완료</button>` : ''}
        </div>
      </div>
    </div>`;
  });

  panel.innerHTML = html;
}

function onFieldChange(id, field, value){
  const s = studentById(id); if (!s) return;
  s[field] = value;
  persistStudents();
  renderReview();
}
function onFeeTypeChange(id, type){
  const s = studentById(id); if (!s) return;
  s.feeType = type;
  const preset = feeForType(type);
  if (preset !== null) s.baseFee = preset;
  persistStudents();
  renderReview();
}
function onSibGroupChange(id, val){
  const s = studentById(id); if (!s) return;
  if (val === '__new__'){
    const name = prompt('새 형제그룹 이름 (예: 원생 이름들)');
    if (!name){ renderReview(); return; }
    const gid = 'sib_' + Date.now();
    groups[gid] = { name: name, discountType:'amount', discountValue:0 };
    persistGroups();
    s.sibGroup = gid;
  } else {
    s.sibGroup = val || null;
  }
  persistStudents();
  renderReview();
}
function markReviewDone(id){
  const s = studentById(id); if (!s) return;
  s.reviewDone = true;
  persistStudents();
  toast('확인 완료로 표시했어요');
  renderReview();
}

/* ===================== 납부현황 탭 ===================== */
function availableMonths(){
  // localStorage에 있는 월 + 기본월 + 현재월 포함
  const keys = Object.keys(localStorage).filter(k=>k.startsWith(MONTH_PREFIX)).map(k=>k.slice(MONTH_PREFIX.length));
  if (!keys.includes(DEFAULT_MONTH)) keys.push(DEFAULT_MONTH);
  if (!keys.includes(currentMonth)) keys.push(currentMonth);
  return Array.from(new Set(keys)).sort();
}
function changeMonth(m){
  currentMonth = m;
  monthData = loadMonth(currentMonth);
  render();
}
function addNewMonth(){
  const m = prompt('새 월 (예: 2026-10)', nextMonthGuess());
  if (!m) return;
  if (!/^\d{4}-\d{2}$/.test(m)){ alert('YYYY-MM 형식으로 입력해주세요'); return; }
  const carrySibling = confirm('원생 목록/형제그룹/기본요금은 그대로 이어받고, 납입일·금액·비고만 새로 입력합니다. 진행할까요?');
  if (!carrySibling) return;
  const data = {};
  students.forEach(s => { data[s.id] = { paydate:'', method:'', amount:null, note:'', sickDays:0, travelDays:0, personalDays:0, deduction:0 }; });
  saveMonth(m, data);
  currentMonth = m;
  monthData = data;
  render();
  toast(m + ' 월이 생성되었어요');
}
function nextMonthGuess(){
  const [y,mo] = currentMonth.split('-').map(Number);
  let ny=y, nm=mo+1;
  if (nm>12){ nm=1; ny+=1; }
  return ny + '-' + String(nm).padStart(2,'0');
}

        </tr></thead>

  students.slice().sort((a,b)=>a.name.localeCompare(b.name,'ko')).forEach((s, i) => {

          <option value="계" ${r.method==='계'?'selected':''}>계좌</option>
          <option value="현금" ${r.method==='현금'?'selected':''}>현금</option>
        </select>

    </tr>`;
  });
  html += `</tbody></table></div>`;
  panel.innerHTML = html;

function onMonthFieldChange(id, field, value){
  if (!monthData[id]) monthData[id] = { paydate:'', method:'', amount:null, note:'', sickDays:0, travelDays:0, personalDays:0, deduction:0 };
  monthData[id][field] = value;
  saveMonth(currentMonth, monthData);
  renderMonth();

      <div class="stu-top">
        <div>
          <div class="stu-name">${s.name} <span class="stu-sub">${s.grade||''}</span></div>
          <div class="stu-sub" style="margin-top:4px;">제안액 ${fmtMoney(sug)} · ${s.feeType||'-'}</div>
          <div class="stu-sub" style="margin-top:2px;">아버지 ${s.fatherPhone||'-'} / 어머니 ${s.motherPhone||'-'}</div>
        </div>
      </div>
    </div>`;
  });
  panel.innerHTML = html;
}

/* ===================== 형제관리 탭 ===================== */
function renderSibling(){
  const panel = document.getElementById('panel-sibling');
  let html = `<div class="card">
    <h2>형제자매 할인 관리</h2>
    <div class="sub">그룹별로 할인을 한 번 설정하면 소속 원생 전원의 제안액에 자동 반영돼요.</div>
  </div>`;

  const gids = Object.keys(groups);
  if (gids.length === 0){
    html += `<div class="empty-state">등록된 형제그룹이 없어요. '원생확인' 탭에서 원생별로 그룹을 지정해주세요.</div>`;
  }
  gids.forEach(gid => {
    const g = groups[gid];
    const members = students.filter(s=>s.sibGroup===gid);
    if (members.length === 0) return;
    html += `<div class="card group-card">
      <div class="row" style="align-items:flex-end;">
        <div class="field" style="flex:2;">
          <label>그룹 이름</label>
          <input type="text" value="${g.name}" onchange="onGroupFieldChange('${gid}','name',this.value)">
        </div>
      </div>
      <div class="group-members">구성원: ${members.map(m=>m.name).join(', ')} (${members.length}명)</div>
      <div class="row">
        <div class="field">
          <label>할인 방식</label>
          <select onchange="onGroupFieldChange('${gid}','discountType',this.value)">
            <option value="amount" ${g.discountType==='amount'?'selected':''}>정액 할인(원)</option>
            <option value="percent" ${g.discountType==='percent'?'selected':''}>정률 할인(%)</option>
          </select>
        </div>
        <div class="field">
          <label>할인값</label>
          <input type="number" value="${g.discountValue||0}" onchange="onGroupFieldChange('${gid}','discountValue',Number(this.value))">
        </div>
      </div>
    </div>`;
  });
  panel.innerHTML = html;
}
function onGroupFieldChange(gid, field, value){
  groups[gid][field] = value;
  persistGroups();
  renderSibling();
}

/* ===================== 결석차감 탭 ===================== */
let absenceSearch = '';
function renderAbsence(){
  const panel = document.getElementById('panel-absence');
  let html = `<div class="card">
    <h2>결석 차감 계산기 (${currentMonth})</h2>
    <div class="sub">병결 최대 10일, 여행 최대 5일까지 1일당 5,000원 차감돼요. 개인사유 결석은 차감되지 않아요(한도 초과분도 동일).</div>
    <input type="search" class="search-box" placeholder="이름 검색" value="${absenceSearch}" oninput="absenceSearch=this.value;renderAbsence();">
  </div>`;

  const list = students.filter(s => !absenceSearch || s.name.includes(absenceSearch))
    .sort((a,b)=>a.name.localeCompare(b.name,'ko'));

  list.forEach(s => {
    const r = monthData[s.id] || { sickDays:0, travelDays:0, personalDays:0, deduction:0 };
    html += `<div class="stu-row">
      <div class="stu-top"><div class="stu-name">${s.name}</div></div>
      <div class="stu-details" style="display:block;">
        <div class="row">
          <div class="field">
            <label>병결일수 (최대10)</label>
            <input type="number" min="0" max="30" value="${r.sickDays||0}" onchange="onAbsenceChange('${s.id}','sickDays',this.value)">
          </div>
          <div class="field">
            <label>여행일수 (최대5)</label>
            <input type="number" min="0" max="30" value="${r.travelDays||0}" onchange="onAbsenceChange('${s.id}','travelDays',this.value)">
          </div>
          <div class="field">
            <label>개인사유(차감x)</label>
            <input type="number" min="0" max="30" value="${r.personalDays||0}" onchange="onAbsenceChange('${s.id}','personalDays',this.value)">
          </div>
        </div>
        <div class="sub" style="margin:4px 0 0;">차감액: <b style="color:var(--danger)">${fmtMoney(r.deduction||0)}</b> → 이번달 제안액 ${fmtMoney(suggestedAmount(s,r))}</div>
      </div>
    </div>`;
  });
  panel.innerHTML = html;
}
function onAbsenceChange(id, field, value){
  if (!monthData[id]) monthData[id] = { paydate:'', method:'', amount:null, note:'', sickDays:0, travelDays:0, personalDays:0, deduction:0 };
  const r = monthData[id];
  r[field] = Number(value) || 0;
  const sick = Math.min(r.sickDays||0, 10);
  const travel = Math.min(r.travelDays||0, 5);
  r.deduction = (sick + travel) * 5000;
  saveMonth(currentMonth, monthData);
  renderAbsence();
}

/* ===================== 시작 ===================== */
render();

</script>

</html>
